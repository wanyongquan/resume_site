<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Academic theme CSS (local copy, includes Bootstrap 4.3.1) -->
  <link rel="stylesheet" href="{{ '/assets/css/academic.min.css' | relative_url }}">
  <!-- Fonts used by the Academic theme -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">

  <style>
    /* ---- Jekyll markdown -> Academic look adapter ---- */
    body { padding-top: 58px; font-size: 15px; }

    /* fixed navbar (Academic style) */
    .navbar { font-family: var(--wm-font, inherit); }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .navbar-nav .nav-link { color: rgba(255,255,255,.85) !important; font-size: 14.5px; padding: .5rem .8rem; }
    .navbar-nav .nav-link:hover { color: #fff !important; }
    @media (max-width: 991px) {
      .navbar-nav .nav-link { color: #34495e !important; }
    }

    main.container { max-width: 960px; padding-top: 36px; padding-bottom: 64px; }
    section[id], h2[id] { scroll-margin-top: 66px; }

    /* hero name (markdown h1) */
    main h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 2.6rem; font-weight: 700; letter-spacing: 2px;
      margin: 6px 0 10px; color: #2962ff;
    }
    /* Academic section headings (markdown h2) */
    main h2 {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.8rem; font-weight: 700; color: #2962ff;
      border-bottom: 2px solid rgba(41, 98, 255, .25);
      padding-bottom: 8px; margin: 44px 0 20px;
    }
    /* subsection headings (markdown h3) */
    main h3 {
      font-size: 1.22rem; font-weight: 700; color: #34495e;
      margin: 26px 0 8px;
    }
    main h3 + p { color: #55595c; margin-bottom: 10px; }

    /* date tags written as `code` in markdown -> muted text, Academic style */
    main p code, main li code, main td code {
      background: none; color: #6b7280; padding: 0;
      font-family: 'Source Sans 3', sans-serif; font-size: .9em;
      white-space: nowrap;
    }
    /* the avatar image (rectangle, floated right) */
    main img[align=right] { float: right; margin: 0 0 18px 26px; border-radius: 0; }

    /* strong emphasis like Academic (dark ink, no color) */
    main strong { color: #2b3035; font-weight: 600; }

    /* tables: Bootstrap-ish, first column as label */
    main table { width: 100%; margin: 14px 0 6px; font-size: 14.5px; border: 0; }
    main th, main td { border-top: 1px solid #e9ecef; border-bottom: 0; padding: 10px 12px; vertical-align: top; }
    main thead th { border-bottom: 2px solid #dee2e6; }
    main tr:first-child td { border-top: 0; }
    main td:first-child { width: 190px; white-space: nowrap; font-weight: 600; color: #34495e; }

    /* lists */
    main ul li, main ol li { margin: 7px 0; }
    main ol > li { margin: 12px 0; }

    /* core courses: two-column card grid with chips */
    .course-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px 30px; margin: 12px 0 8px;
    }
    .course-group { border-left: 3px solid rgba(41, 98, 255, .35); padding: 2px 0 2px 14px; }
    .course-group .cg-title {
      display: block; font-weight: 700; font-size: 14.5px; color: #34495e; margin-bottom: 8px;
    }
    .course-group ul {
      list-style: none; margin: 0 !important; padding: 0 !important;
      display: flex; flex-wrap: wrap; gap: 6px 8px;
    }
    .course-group li {
      margin: 0; font-size: 13px; color: #4b5563; line-height: 1.5;
      background: #f1f3f9; border-radius: 3px; padding: 3px 9px;
    }
    @media (max-width: 700px) { .course-grid { grid-template-columns: 1fr; gap: 16px; } }

    /* footer */
    .site-footer {
      border-top: 1px solid #e9ecef; color: #6b7280; font-size: 13.5px;
      text-align: center; padding: 22px 16px 34px; margin-top: 12px;
    }
    .site-footer a { color: #2962ff; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color:#2962ff;">
    <div class="container" style="max-width:1140px;">
      <a class="navbar-brand" href="#top">Yixin Wan</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="#education">Education</a></li>
          <li class="nav-item"><a class="nav-link" href="#publications">Publications</a></li>
          <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
          <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="#activities">Activities</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container" id="top" role="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; 2026 Yixin Wan &middot; Shanghai Jiao Tong University
  </footer>

  <!-- Bootstrap JS needed by navbar-toggler (shipped inside academic.min.css bundle? no - load slim) -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-xrRywqdh3PHs8kKU3WCp2loWpxnEq3awYNA8BOWFkJcz/1BnMhsMRo0h7K4C9NfO" crossorigin="anonymous"></script>
</body>
</html>
